name = "riftsight-worker-spectate"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[triggers]
crons = ["*/2 * * * *"]

[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "riftsight-data"

[vars]
DEFAULT_PATCH = "16.23"
MAX_REQUESTS_PER_RUN = "40"
MAX_GAME_AGE_MINUTES = "50"
# Riot API Key niemals hier eintragen!
# Stattdessen als Secret hinterlegen:
# npx wrangler secret put RIOT_API_KEY
