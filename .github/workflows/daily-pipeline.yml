name: Riftsight Daten-Pipeline
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pipeline, cancel-in-progress: false }
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults: { run: { working-directory: data-pipeline } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: data-pipeline/state
          key: pipeline-state-${{ github.run_id }}
          restore-keys: pipeline-state-
      - run: uv sync --frozen || uv sync
      - run: uv run pytest -q
      - name: Sammeln + Aggregieren
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          SAMPLE_MODE: ${{ vars.SAMPLE_MODE || '0' }}
          RIFTSIGHT_PLATFORMS: ${{ vars.RIFTSIGHT_PLATFORMS || 'EUW1,KR,NA1' }}
        run: uv run riftsight run
      - name: Pro-Accounts synchronisieren (Leaguepedia -> Account-V1)
        continue-on-error: true
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          RIFTSIGHT_PLATFORMS: ${{ vars.RIFTSIGHT_PLATFORMS || 'EUW1,KR,NA1' }}
        run: uv run python -m riftsight_pipeline.pro_accounts
      - name: Upload nach Cloudflare R2 (optional)
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'riftsight-data' }}
        run: |
          if [ -z "$R2_ENDPOINT_URL" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "R2-Secrets nicht gesetzt - Upload uebersprungen."; exit 0
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto
          aws s3 sync dist/ "s3://${R2_BUCKET}/" --endpoint-url "$R2_ENDPOINT_URL" --exclude "*" --include "*.json" \
            --exclude "pro_spectate.json" --content-type "application/json; charset=utf-8" --cache-control "public, max-age=600" --no-progress
      - uses: actions/upload-pages-artifact@v3
        with: { path: data-pipeline/dist }
  deploy:
    needs: pipeline
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@v4
